<title>A Level Maths Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one centred study column on graph paper. Controls on top, one flip card in the middle, deck actions below. Pure = blue, Statistics = teal. */
:root {
  --paper: #EDF1F6;
  --grid: rgba(40, 70, 120, 0.07);
  --card: #FFFFFF;
  --ink: #14213A;
  --muted: #55627A;
  --line: #CBD5E3;
  --pure: #2A56D6;
  --pure-soft: #E3EAFB;
  --stats: #0B7F80;
  --stats-soft: #DAF1F0;
  --good: #1E8E4E;
  --on-good: #FFFFFF;
  --warn: #A94B08;
  --font-ui: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-math: 'STIX Two Text', 'Cambria Math', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1520; --grid: rgba(150, 180, 230, 0.06); --card: #182131; --ink: #E8EEF8; --muted: #9AA8BF;
    --line: #2B3750; --pure: #84A6FF; --pure-soft: #1E2C52; --stats: #4FD1C5; --stats-soft: #123A3A;
    --good: #4CC38A; --on-good: #06210F; --warn: #F2A65A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1520; --grid: rgba(150, 180, 230, 0.06); --card: #182131; --ink: #E8EEF8; --muted: #9AA8BF;
  --line: #2B3750; --pure: #84A6FF; --pure-soft: #1E2C52; --stats: #4FD1C5; --stats-soft: #123A3A;
  --good: #4CC38A; --on-good: #06210F; --warn: #F2A65A; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc, var(--pure)); outline-offset: 2px; }

.controls { display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 2px; min-height: 44px; font-size: 0.85rem; white-space: nowrap; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; white-space: nowrap; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 0.88rem; font-weight: 500; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.row2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row2 label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; color: var(--ink); }
.tool { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 40px; font-size: 0.9rem; font-weight: 500; }
.tool[aria-pressed="true"] { border-color: var(--ink); }
.tool.confirm { border-color: var(--warn); color: var(--warn); }

.stage { display: flex; flex-direction: column; gap: 12px; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.3s ease; }

.card { perspective: 1400px; cursor: pointer; outline: none; border-radius: 14px; }
.card[data-s="P"] { --acc: var(--pure); --acc-soft: var(--pure-soft); }
.card[data-s="S"] { --acc: var(--stats); --acc-soft: var(--stats-soft); }
.inner { display: grid; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.3, 0.7, 0.2, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; min-width: 0; min-height: 320px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--acc, var(--pure));
  border-radius: 14px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px;
}
.back { transform: rotateY(180deg); }
.tagrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tag { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc); background: var(--acc-soft); padding: 4px 10px; border-radius: 6px; }
.badge { font-size: 0.76rem; font-weight: 600; color: var(--good); }
.q { font-family: var(--font-math); font-size: clamp(1.3rem, 4.2vw, 1.65rem); line-height: 1.35; margin: auto 0; font-weight: 600; text-wrap: balance; }
.a { font-family: var(--font-math); font-size: clamp(1.05rem, 3.4vw, 1.2rem); line-height: 1.75; overflow-wrap: anywhere; }
.cue { font-size: 0.82rem; color: var(--muted); }
sup, sub { line-height: 0; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.15em; line-height: 1.25; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.25em 0.05em; }
.fr > span:last-child { padding: 0.05em 0.25em 0; }
.rt .ov { border-top: 1px solid currentColor; padding: 0 0.1em; }
.bar-x { text-decoration: overline; }
.tw { overflow-x: auto; }
.mini { border-collapse: collapse; font-size: 1rem; line-height: 1.4; }
.mini th, .mini td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; }
.mini th { color: var(--muted); font-weight: 600; background: var(--acc-soft); }

.actions { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr 1fr; gap: 10px; }
.btn { min-height: 48px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.btn.learn { border-color: var(--warn); color: var(--warn); }
.btn.got { background: var(--good); border-color: var(--good); color: var(--on-good); }
.hint { margin: 0; font-size: 0.82rem; color: var(--muted); }
.empty { font-family: var(--font-ui); font-size: 1.1rem; margin: auto 0; color: var(--muted); }

@media (max-width: 540px) {
  .actions { grid-template-columns: 1fr 1fr; }
  .btn.learn { order: 1; } .btn.got { order: 2; } .btn.prev { order: 3; } .btn.next { order: 4; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .inner, .bar i { transition: none; }
}
</style>

<main class="wrap">
  <header>
    <h1>A Level Maths Flashcards</h1>
    <p class="sub">Cambridge International A Level Mathematics (9709) · <span id="total"></span> cards</p>
  </header>

  <div class="controls">
    <div class="seg" id="seg" role="group" aria-label="Subject">
      <button type="button" data-s="ALL" aria-pressed="true">All</button>
      <button type="button" data-s="P1" aria-pressed="false">Pure 1</button>
      <button type="button" data-s="P3" aria-pressed="false">Pure 3</button>
      <button type="button" data-s="S1" aria-pressed="false">Stats 1</button>
      <button type="button" data-s="S2" aria-pressed="false">Stats 2</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Topic"></div>
    <div class="row2">
      <label for="status">Show
        <select id="status">
          <option value="all">All cards</option>
          <option value="learning">Still learning</option>
          <option value="known">Got it</option>
        </select>
      </label>
      <button type="button" class="tool" id="shuffle" aria-pressed="false">Shuffle</button>
      <button type="button" class="tool" id="reset">Reset progress</button>
    </div>
  </div>

  <section class="stage" aria-label="Flashcard">
    <div class="meta"><span id="pos"></span><span id="knownCount"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press space to flip.">
      <div class="inner">
        <div class="face front">
          <div class="tagrow"><span class="tag" id="tagF"></span><span class="badge" id="badge"></span></div>
          <div class="q" id="q"></div>
          <div class="cue">Tap the card or press space to reveal the answer</div>
        </div>
        <div class="face back">
          <div class="tagrow"><span class="tag" id="tagB"></span></div>
          <div class="a" id="a"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn prev" id="prev">← Previous</button>
      <button type="button" class="btn learn" id="learn">Still learning</button>
      <button type="button" class="btn got" id="got">Got it</button>
      <button type="button" class="btn next" id="next">Next →</button>
    </div>
    <p class="hint">Space flips · ← → move · K got it · L still learning</p>
  </section>
</main>

<script>
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const rt = x => `<span class="rt">√<span class="ov">${x}</span></span>`;
const xb = `<span class="bar-x">x</span>`;
const L = (...lines) => lines.join('<br>');

const QA = 'Quadratics & algebra', FN = 'Functions', GE = 'Coordinate geometry', CM = 'Circular measure', TR = 'Trigonometry',
  SE = 'Series', DI = 'Differentiation', IN = 'Integration';
const AL = 'Algebra', LE = 'Logarithms & exponentials', NS = 'Numerical solution', VE = 'Vectors', CX = 'Complex numbers';
const DA = 'Data', PC = 'Permutations & combinations', PB = 'Probability', DR = 'Discrete random variables',
  BG = 'Binomial & geometric', NO = 'Normal distribution';
const PO = 'Poisson', LC = 'Linear combinations', CR = 'Continuous random variables', SM = 'Sampling & estimation', HT = 'Hypothesis testing';

const cards = [
/* =================== PURE 1 =================== */
['P', QA, `State the quadratic formula.`,
  L(`x = ${fr('−b ± ' + rt('b² − 4ac'), '2a')}`, `for ax² + bx + c = 0`), 'P1'],
['P', QA, `What does the discriminant b² − 4ac tell you about ax² + bx + c = 0?`,
  L(`b² − 4ac &gt; 0 : two distinct real roots`, `b² − 4ac = 0 : one repeated real root (graph touches the x-axis)`, `b² − 4ac &lt; 0 : no real roots (graph misses the x-axis)`), 'P1'],
['P', QA, `Complete the square for ax² + bx + c.`,
  L(`a(x + ${fr('b', '2a')})² + c − ${fr('b²', '4a')}`, `Turning point: (−${fr('b', '2a')}, c − ${fr('b²', '4a')})`), 'P1'],
['P', QA, `How do you solve a quadratic inequality?`,
  L(`1. Find the roots.`, `2. Sketch the graph.`, `3. For a positive x² coefficient, &gt; 0 gives the outside regions (x &lt; α or x &gt; β) and &lt; 0 gives between the roots.`, `Multiplying or dividing by a negative reverses the inequality.`), 'P1'],
['P', QA, `List the laws of indices.`,
  L(`a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>`, `a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>`, `(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>`, `a<sup>−n</sup> = ${fr('1', 'a<sup>n</sup>')}`, `a<sup>1/n</sup> = <sup>n</sup>√a, a<sup>m/n</sup> = (<sup>n</sup>√a)<sup>m</sup>`, `a<sup>0</sup> = 1`), 'P1'],
['P', QA, `Rules for surds, and how do you rationalise a denominator?`,
  L(`√a × √b = √(ab)`, `(√a)² = a`, `${fr('1', 'a + √b')} = ${fr('a − √b', 'a² − b')}`, `Multiply top and bottom by the conjugate of the denominator.`), 'P1'],

['P', FN, `Composite and inverse functions: what are the key facts?`,
  L(`fg(x) = f(g(x)): apply g first.`, `f<sup>−1</sup>: swap x and y, then rearrange.`, `The graph of y = f<sup>−1</sup>(x) is y = f(x) reflected in y = x.`, `Domain of f<sup>−1</sup> = range of f.`, `ff<sup>−1</sup>(x) = x. Only one-to-one functions have an inverse.`), 'P1'],
['P', FN, `Transformations: what do y = f(x) + a and y = f(x + a) do?`,
  L(`y = f(x) + a : translation up by a, vector (0, a).`, `y = f(x + a) : translation left by a, vector (−a, 0).`, `Changes inside the bracket act on x and do the opposite of what you expect.`), 'P1'],
['P', FN, `Transformations: what do y = af(x), y = f(ax), y = −f(x) and y = f(−x) do?`,
  L(`y = af(x) : vertical stretch, scale factor a.`, `y = f(ax) : horizontal stretch, scale factor ${fr('1', 'a')}.`, `y = −f(x) : reflection in the x-axis.`, `y = f(−x) : reflection in the y-axis.`), 'P1'],

['P', GE, `Gradient, distance and midpoint between (x<sub>1</sub>, y<sub>1</sub>) and (x<sub>2</sub>, y<sub>2</sub>).`,
  L(`m = ${fr('y<sub>2</sub> − y<sub>1</sub>', 'x<sub>2</sub> − x<sub>1</sub>')}`, `d = ${rt('(x<sub>2</sub> − x<sub>1</sub>)² + (y<sub>2</sub> − y<sub>1</sub>)²')}`, `Midpoint = (${fr('x<sub>1</sub> + x<sub>2</sub>', '2')}, ${fr('y<sub>1</sub> + y<sub>2</sub>', '2')})`), 'P1'],
['P', GE, `Equation of a straight line, and the conditions for parallel and perpendicular lines.`,
  L(`y − y<sub>1</sub> = m(x − x<sub>1</sub>)`, `Parallel: m<sub>1</sub> = m<sub>2</sub>`, `Perpendicular: m<sub>1</sub>m<sub>2</sub> = −1, so the perpendicular gradient is −${fr('1', 'm')}.`), 'P1'],
['P', GE, `How do you find where a line meets a curve?`,
  L(`Substitute the line's equation into the curve's equation to get a quadratic.`, `Discriminant &gt; 0 : two intersection points.`, `Discriminant = 0 : the line is a tangent.`, `Discriminant &lt; 0 : no intersection.`), 'P1'],
['P', GE, `Equation of a circle with centre (a, b) and radius r.`,
  L(`(x − a)² + (y − b)² = r²`, `x² + y² + 2gx + 2fy + c = 0 has centre (−g, −f) and radius ${rt('g² + f² − c')}.`), 'P1'],
['P', GE, `Which circle properties help in coordinate geometry?`,
  L(`The angle in a semicircle is 90°.`, `A tangent is perpendicular to the radius at the point of contact.`, `The perpendicular from the centre to a chord bisects the chord.`, `The perpendicular bisector of any chord passes through the centre.`), 'P1'],

['P', CM, `Radians: conversion, arc length, sector area and segment area.`,
  L(`π radians = 180°`, `Arc length s = rθ`, `Sector area = ${fr('1', '2')}r²θ`, `Segment area = ${fr('1', '2')}r²(θ − sin θ)`, `θ must be in radians.`), 'P1'],

['P', TR, `State the two basic trig identities.`,
  L(`sin²θ + cos²θ = 1`, `tan θ = ${fr('sin θ', 'cos θ')}`), 'P1'],
['P', TR, `Give the exact values of sin, cos and tan at 0°, 30°, 45°, 60° and 90°.`,
  `<div class="tw"><table class="mini"><tr><th>θ</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr><tr><th>sin θ</th><td>0</td><td>${fr('1', '2')}</td><td>${fr('√2', '2')}</td><td>${fr('√3', '2')}</td><td>1</td></tr><tr><th>cos θ</th><td>1</td><td>${fr('√3', '2')}</td><td>${fr('√2', '2')}</td><td>${fr('1', '2')}</td><td>0</td></tr><tr><th>tan θ</th><td>0</td><td>${fr('1', '√3')}</td><td>1</td><td>√3</td><td>—</td></tr></table></div>`, 'P1'],
['P', TR, `How do you solve trig equations in a given interval?`,
  L(`sin θ = k : θ = α, 180° − α`, `cos θ = k : θ = α, 360° − α`, `tan θ = k : θ = α, α + 180°`, `Add multiples of 360° (180° for tan) to find all solutions in the range.`, `For sin 2θ and similar, scale the interval first, then solve for the whole angle.`, `In radians use π and 2π.`), 'P1'],
['P', TR, `Period and key features of the sin, cos and tan graphs.`,
  L(`sin and cos: period 360° (2π), amplitude 1, range −1 to 1.`, `tan: period 180° (π), asymptotes at 90° + 180°n.`, `y = a sin(bx) + c : amplitude a, period ${fr('360°', 'b')}, shifted up by c.`), 'P1'],
['P', TR, `Give the domain and range of sin<sup>−1</sup>x, cos<sup>−1</sup>x and tan<sup>−1</sup>x.`,
  L(`sin<sup>−1</sup>x : domain −1 ≤ x ≤ 1, range −${fr('π', '2')} ≤ y ≤ ${fr('π', '2')}`, `cos<sup>−1</sup>x : domain −1 ≤ x ≤ 1, range 0 ≤ y ≤ π`, `tan<sup>−1</sup>x : domain all real x, range −${fr('π', '2')} &lt; y &lt; ${fr('π', '2')}`), 'P1'],

['P', SE, `Arithmetic sequences: nth term and sum of n terms.`,
  L(`u<sub>n</sub> = a + (n − 1)d`, `S<sub>n</sub> = ${fr('n', '2')}[2a + (n − 1)d] = ${fr('n', '2')}(a + l)`, `a = first term, d = common difference, l = last term.`), 'P1'],
['P', SE, `Geometric sequences: nth term, sum and sum to infinity.`,
  L(`u<sub>n</sub> = ar<sup>n−1</sup>`, `S<sub>n</sub> = ${fr('a(1 − r<sup>n</sup>)', '1 − r')}`, `S<sub>∞</sub> = ${fr('a', '1 − r')}, valid only when |r| &lt; 1`), 'P1'],
['P', SE, `Binomial expansion of (a + b)<sup>n</sup> for positive integer n.`,
  L(`(a + b)<sup>n</sup> = Σ <sup>n</sup>C<sub>r</sub> a<sup>n−r</sup>b<sup>r</sup>, for r = 0 to n`, `<sup>n</sup>C<sub>r</sub> = ${fr('n!', 'r!(n − r)!')}`, `Pascal's triangle gives the coefficients for small n.`), 'P1'],

['P', DI, `Power rule and chain rule.`,
  L(`d/dx (x<sup>n</sup>) = nx<sup>n−1</sup>`, `${fr('dy', 'dx')} = ${fr('dy', 'du')} × ${fr('du', 'dx')}`, `d/dx (ax + b)<sup>n</sup> = na(ax + b)<sup>n−1</sup>`), 'P1'],
['P', DI, `How do you find and classify stationary points?`,
  L(`Solve f′(x) = 0.`, `f″(x) &gt; 0 : minimum.`, `f″(x) &lt; 0 : maximum.`, `f″(x) = 0 : inconclusive, so check the sign of f′ either side.`), 'P1'],
['P', DI, `Increasing and decreasing functions.`,
  L(`f′(x) &gt; 0 : f is increasing.`, `f′(x) &lt; 0 : f is decreasing.`, `Solve f′(x) &gt; 0 as an inequality to find the interval.`), 'P1'],
['P', DI, `Equations of the tangent and normal at (x<sub>1</sub>, y<sub>1</sub>).`,
  L(`Tangent: y − y<sub>1</sub> = f′(x<sub>1</sub>)(x − x<sub>1</sub>)`, `Normal gradient = −${fr('1', 'f′(x<sub>1</sub>)')}`, `Normal: y − y<sub>1</sub> = −${fr('1', 'f′(x<sub>1</sub>)')}(x − x<sub>1</sub>)`), 'P1'],
['P', DI, `Connected rates of change.`,
  L(`${fr('dA', 'dt')} = ${fr('dA', 'dr')} × ${fr('dr', 'dt')}`, `${fr('dy', 'dx')} = ${fr('1', 'dx/dy')}`, `Write the chain rule so the unwanted variables cancel.`), 'P1'],
['P', DI, `Steps for an optimisation problem.`,
  L(`1. Write the quantity to optimise.`, `2. Use the constraint to get one variable.`, `3. Differentiate and set the derivative to 0.`, `4. Check max or min with the second derivative.`, `5. Answer in context, with units.`), 'P1'],

['P', IN, `Integrating powers and linear brackets.`,
  L(`∫x<sup>n</sup> dx = ${fr('x<sup>n+1</sup>', 'n + 1')} + c, n ≠ −1`, `∫(ax + b)<sup>n</sup> dx = ${fr('(ax + b)<sup>n+1</sup>', 'a(n + 1)')} + c`, `Definite integral: [F(x)]<sub>a</sub><sup>b</sup> = F(b) − F(a)`), 'P1'],
['P', IN, `Areas using integration.`,
  L(`Area under a curve = ∫<sub>a</sub><sup>b</sup> y dx`, `Between a curve and a line or another curve = ∫(top − bottom) dx`, `Area below the x-axis comes out negative, so split the integral at the roots.`, `Area to the y-axis = ∫x dy`), 'P1'],
['P', IN, `Volume of revolution about the x-axis and the y-axis.`,
  L(`About the x-axis: V = π∫<sub>a</sub><sup>b</sup> y² dx`, `About the y-axis: V = π∫<sub>c</sub><sup>d</sup> x² dy`, `Rewrite the curve in terms of the variable you integrate with respect to.`, `For a region between two curves, subtract the two volumes.`), 'P1'],

/* =================== PURE 3 =================== */
['P', AL, `How do you solve |x − a| &lt; b, |x − a| &gt; b and |f(x)| = g(x)?`,
  L(`|x − a| &lt; b ⇒ a − b &lt; x &lt; a + b`, `|x − a| &gt; b ⇒ x &lt; a − b or x &gt; a + b`, `|f(x)| = g(x): solve f(x) = g(x) and f(x) = −g(x), then check each answer in the original equation.`), 'P3'],
['P', AL, `State the factor theorem.`,
  L(`If f(a) = 0, then (x − a) is a factor of f(x), and the other way round.`, `For a factor (ax − b), test f(${fr('b', 'a')}) = 0.`), 'P3'],
['P', AL, `State the remainder theorem.`,
  L(`Dividing f(x) by (x − a) leaves remainder f(a).`, `Dividing by (ax − b) leaves remainder f(${fr('b', 'a')}).`), 'P3'],
['P', AL, `How do you split an expression into partial fractions?`,
  L(`${fr('px + q', '(x + a)(x + b)')} = ${fr('A', 'x + a')} + ${fr('B', 'x + b')}`, `${fr('px + q', '(x + a)<sup>2</sup>')} = ${fr('A', 'x + a')} + ${fr('B', '(x + a)<sup>2</sup>')}`, `If the numerator's degree is at least the denominator's, divide first.`, `Find the constants by substituting values of x or equating coefficients.`), 'P3'],
['P', AL, `Binomial expansion of (1 + x)<sup>n</sup> for any rational n. When is it valid?`,
  L(`1 + nx + ${fr('n(n − 1)', '2!')}x² + ${fr('n(n − 1)(n − 2)', '3!')}x³ + …`, `Valid for |x| &lt; 1 when n is negative or a fraction.`, `(a + bx)<sup>n</sup> = a<sup>n</sup>(1 + ${fr('bx', 'a')})<sup>n</sup>, valid when |${fr('bx', 'a')}| &lt; 1.`), 'P3'],

['P', LE, `List the laws of logarithms.`,
  L(`log<sub>a</sub>x + log<sub>a</sub>y = log<sub>a</sub>(xy)`, `log<sub>a</sub>x − log<sub>a</sub>y = log<sub>a</sub>(${fr('x', 'y')})`, `k log<sub>a</sub>x = log<sub>a</sub>(x<sup>k</sup>)`, `log<sub>a</sub>1 = 0, log<sub>a</sub>a = 1, a<sup>log<sub>a</sub>x</sup> = x`), 'P3'],
['P', LE, `How do you solve a<sup>x</sup> = b?`,
  L(`Take logs of both sides: x log a = log b.`, `x = ${fr('log b', 'log a')} (any base, or use ln).`, `Change of base: log<sub>a</sub>b = ${fr('log<sub>c</sub>b', 'log<sub>c</sub>a')}`), 'P3'],
['P', LE, `How do you use logs to turn y = ax<sup>n</sup> and y = ab<sup>x</sup> into straight lines?`,
  L(`y = ax<sup>n</sup> ⇒ log y = n log x + log a`, `Plot log y against log x: gradient n, intercept log a.`, `y = ab<sup>x</sup> ⇒ log y = x log b + log a`, `Plot log y against x: gradient log b, intercept log a.`), 'P3'],
['P', LE, `Key features of y = e<sup>x</sup> and y = ln x.`,
  L(`y = e<sup>x</sup> : passes through (0, 1), asymptote y = 0, range y &gt; 0.`, `y = ln x : passes through (1, 0), asymptote x = 0, domain x &gt; 0.`, `Each is the reflection of the other in y = x.`, `y = Ae<sup>kx</sup> models growth if k &gt; 0 and decay if k &lt; 0.`), 'P3'],

['P', TR, `State the Pythagorean trig identities.`,
  L(`sin²θ + cos²θ = 1`, `1 + tan²θ = sec²θ`, `1 + cot²θ = cosec²θ`), 'P3'],
['P', TR, `Define sec, cosec and cot.`,
  L(`sec θ = ${fr('1', 'cos θ')}`, `cosec θ = ${fr('1', 'sin θ')}`, `cot θ = ${fr('1', 'tan θ')} = ${fr('cos θ', 'sin θ')}`, `Each has asymptotes where its denominator is 0.`), 'P3'],
['P', TR, `State the addition formulae.`,
  L(`sin(A ± B) = sin A cos B ± cos A sin B`, `cos(A ± B) = cos A cos B ∓ sin A sin B`, `tan(A ± B) = ${fr('tan A ± tan B', '1 ∓ tan A tan B')}`), 'P3'],
['P', TR, `State the double angle formulae.`,
  L(`sin 2A = 2 sin A cos A`, `cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A`, `tan 2A = ${fr('2 tan A', '1 − tan²A')}`), 'P3'],
['P', TR, `Write a sin θ + b cos θ in the form R sin(θ + α).`,
  L(`R = ${rt('a² + b²')}, with R cos α = a and R sin α = b, so tan α = ${fr('b', 'a')}.`, `Maximum value R when sin(θ + α) = 1; minimum −R.`), 'P3'],

['P', DI, `Standard derivatives: e<sup>x</sup>, ln x and trig functions (x in radians).`,
  L(`d/dx (e<sup>kx</sup>) = ke<sup>kx</sup>`, `d/dx (ln x) = ${fr('1', 'x')}`, `sin kx → k cos kx`, `cos kx → −k sin kx`, `tan kx → k sec²kx`), 'P3'],
['P', DI, `State the product rule and quotient rule.`,
  L(`Product: y = uv ⇒ y′ = uv′ + vu′`, `Quotient: y = ${fr('u', 'v')} ⇒ y′ = ${fr('vu′ − uv′', 'v²')}`), 'P3'],
['P', DI, `How do you differentiate implicitly?`,
  L(`d/dx (y<sup>n</sup>) = ny<sup>n−1</sup> ${fr('dy', 'dx')}`, `d/dx (xy) = y + x ${fr('dy', 'dx')}`, `d/dx (sin y) = cos y ${fr('dy', 'dx')}`, `Collect the dy/dx terms, factorise, then divide.`), 'P3'],
['P', DI, `Parametric equations: how do you find dy/dx and the Cartesian equation?`,
  L(`${fr('dy', 'dx')} = ${fr('dy/dt', 'dx/dt')}`, `Eliminate t by rearranging one equation, or use an identity such as sin²t + cos²t = 1.`, `Keep any restriction on x or y that comes from the range of t.`), 'P3'],

['P', IN, `Standard integrals (add + c for indefinite integrals).`,
  L(`∫${fr('1', 'x')} dx = ln|x|`, `∫${fr('1', 'ax + b')} dx = ${fr('1', 'a')} ln|ax + b|`, `∫e<sup>kx</sup> dx = ${fr('e<sup>kx</sup>', 'k')}`, `∫cos kx dx = ${fr('sin kx', 'k')}, ∫sin kx dx = −${fr('cos kx', 'k')}`, `∫sec²kx dx = ${fr('tan kx', 'k')}`), 'P3'],
['P', IN, `Reverse chain rule patterns.`,
  L(`∫${fr('f′(x)', 'f(x)')} dx = ln|f(x)| + c`, `∫f′(x)[f(x)]<sup>n</sup> dx = ${fr('[f(x)]<sup>n+1</sup>', 'n + 1')} + c`), 'P3'],
['P', IN, `State the integration by parts formula and how to choose u.`,
  L(`∫u ${fr('dv', 'dx')} dx = uv − ∫v ${fr('du', 'dx')} dx`, `Take u as the part that gets simpler when differentiated (ln x, a polynomial).`, `For ∫ln x dx use u = ln x and dv/dx = 1.`), 'P3'],
['P', IN, `Steps for integration by substitution.`,
  L(`1. Choose u = g(x).`, `2. Find du/dx and replace dx.`, `3. For a definite integral, change the limits to u-values.`, `4. Integrate in u, then substitute back if the integral was indefinite.`), 'P3'],
['P', IN, `Integrating sin²x and cos²x.`,
  L(`sin²x = ${fr('1', '2')}(1 − cos 2x)`, `cos²x = ${fr('1', '2')}(1 + cos 2x)`, `These come from rearranging the double angle formula for cos 2x.`), 'P3'],
['P', IN, `Integrating a fraction that needs partial fractions.`,
  L(`Split into partial fractions first.`, `Integrate each term: ∫${fr('A', 'ax + b')} dx = ${fr('A', 'a')} ln|ax + b|.`, `Combine the logs using the laws of logarithms where asked.`), 'P3'],
['P', IN, `How do you solve a separable differential equation?`,
  L(`${fr('dy', 'dx')} = f(x)g(y) ⇒ ∫${fr('1', 'g(y)')} dy = ∫f(x) dx`, `Include + c on one side, then use the initial condition to find c.`), 'P3'],

['P', NS, `Change of sign method: when does it work and fail?`,
  L(`If f is continuous on [a, b] and f(a), f(b) have opposite signs, there is a root in (a, b).`, `It can fail if f is discontinuous (such as 1/x), if there are two roots in the interval, or if the curve only touches the axis.`), 'P3'],
['P', NS, `Iterative methods: how do you set up and use x<sub>n+1</sub> = g(x<sub>n</sub>)?`,
  L(`Rearrange f(x) = 0 into x = g(x), then iterate from a start value.`, `It converges to a root α when |g′(α)| &lt; 1 and the start is close to α.`, `0 &lt; g′(α) &lt; 1 : staircase. −1 &lt; g′(α) &lt; 0 : cobweb.`, `To show a root is correct to a given accuracy, show a sign change either side of it.`), 'P3'],

['P', VE, `Position vectors, magnitude and unit vectors (2D and 3D).`,
  L(`AB = b − a`, `|xi + yj + zk| = ${rt('x² + y² + z²')}`, `Unit vector in the direction of a = ${fr('a', '|a|')}`), 'P3'],
['P', VE, `How do you show vectors are parallel or points are collinear?`,
  L(`a and b are parallel if a = λb for some scalar λ.`, `Points A, B, C are collinear if AB = λBC (a multiple, with the shared point B).`), 'P3'],
['P', VE, `Midpoint and ratio division of a line segment.`,
  L(`Midpoint of AB: ${fr('1', '2')}(a + b)`, `Point dividing AB in the ratio m : n: ${fr('n·a + m·b', 'm + n')}`), 'P3'],
['P', VE, `State the scalar product and its uses.`,
  L(`a · b = a<sub>1</sub>b<sub>1</sub> + a<sub>2</sub>b<sub>2</sub> + a<sub>3</sub>b<sub>3</sub> = |a||b| cos θ`, `cos θ = ${fr('a · b', '|a||b|')}`, `a · b = 0 ⇔ the vectors are perpendicular (non-zero vectors).`), 'P3'],
['P', VE, `Vector equation of a line.`,
  L(`r = a + λb`, `a is the position vector of a point on the line; b is the direction vector.`, `Parallel lines have parallel direction vectors.`), 'P3'],
['P', VE, `How do you find whether two lines intersect?`,
  L(`Write each line in component form with different parameters λ and μ.`, `Equate two components and solve for λ and μ.`, `Check the third component: if it matches, the lines meet; if not, they are skew (when not parallel).`, `The angle between lines comes from the scalar product of the direction vectors.`), 'P3'],

['P', CX, `Complex numbers: modulus, argument and conjugate.`,
  L(`z = x + iy, with i² = −1`, `Conjugate: z* = x − iy`, `|z| = ${rt('x² + y²')}`, `arg z = θ with tan θ = ${fr('y', 'x')}, −π &lt; θ ≤ π (check the quadrant).`, `zz* = |z|²`), 'P3'],
['P', CX, `Complex arithmetic: dividing, equating parts and square roots.`,
  L(`Add, subtract and multiply as in algebra, using i² = −1.`, `Divide by multiplying top and bottom by the conjugate of the denominator.`, `a + ib = c + id ⇒ a = c and b = d.`, `For √(a + ib), let (x + iy)² = a + ib and equate real and imaginary parts.`), 'P3'],
['P', CX, `Polar form: multiplying and dividing complex numbers.`,
  L(`z = r(cos θ + i sin θ)`, `|z<sub>1</sub>z<sub>2</sub>| = |z<sub>1</sub>||z<sub>2</sub>|, arg(z<sub>1</sub>z<sub>2</sub>) = arg z<sub>1</sub> + arg z<sub>2</sub>`, `|${fr('z<sub>1</sub>', 'z<sub>2</sub>')}| = ${fr('|z<sub>1</sub>|', '|z<sub>2</sub>|')}, arg(${fr('z<sub>1</sub>', 'z<sub>2</sub>')}) = arg z<sub>1</sub> − arg z<sub>2</sub>`), 'P3'],
['P', CX, `Common loci in the Argand diagram.`,
  L(`|z − a| = r : circle, centre a, radius r.`, `|z − a| = |z − b| : perpendicular bisector of the points a and b.`, `arg(z − a) = θ : half-line from a at angle θ to the positive real direction.`, `Inequalities shade a region, for example |z − a| &lt; r is inside the circle.`), 'P3'],
['P', CX, `Roots of polynomials with real coefficients.`,
  L(`Complex roots come in conjugate pairs: if a + ib is a root, so is a − ib.`, `The quadratic factor with these roots is x² − 2ax + (a² + b²).`, `Use the factor theorem and division to find the remaining roots.`), 'P3'],

/* =================== STATISTICS 1 =================== */
['S', DA, `Formulae for mean, variance and standard deviation.`,
  L(`${xb} = ${fr('Σx', 'n')} (or ${fr('Σfx', 'Σf')} for a frequency table)`, `σ² = ${fr('Σx²', 'n')} − ${xb}² (or ${fr('Σfx²', 'Σf')} − ${xb}²)`, `σ = √variance`), 'S1'],
['S', DA, `Coding: how do the mean and standard deviation change if y = (x − a) ÷ b?`,
  L(`x = by + a`, `Mean: ${xb} = b × mean(y) + a`, `Standard deviation: σ<sub>x</sub> = b σ<sub>y</sub>`, `Variance: σ<sub>x</sub>² = b²σ<sub>y</sub>²`), 'S1'],
['S', DA, `What does a box-and-whisker plot show?`,
  L(`Five values: minimum, Q<sub>1</sub>, median, Q<sub>3</sub>, maximum.`, `IQR = Q<sub>3</sub> − Q<sub>1</sub> (spread of the middle 50%).`, `Range = maximum − minimum.`), 'S1'],
['S', DA, `How is a histogram drawn?`,
  L(`Frequency density = ${fr('frequency', 'class width')}`, `Area of a bar is proportional to frequency.`, `The vertical axis is frequency density, not frequency.`), 'S1'],
['S', DA, `Estimate a median or quartile from grouped data or a cumulative frequency curve.`,
  L(`Cumulative frequency is plotted at the upper class boundary.`, `Median at ${fr('n', '2')}, Q<sub>1</sub> at ${fr('n', '4')}, Q<sub>3</sub> at ${fr('3n', '4')}, read from the curve.`, `By interpolation: lower boundary + ${fr('position − cumulative frequency before', 'class frequency')} × class width`), 'S1'],
['S', DA, `How do you compare two data sets?`,
  L(`Compare one measure of location (mean or median) and one measure of spread (standard deviation or IQR).`, `Write each comparison in the context of the question.`), 'S1'],
['S', DA, `What should a stem-and-leaf diagram include?`,
  L(`A key, such as 3 | 4 means 34.`, `Leaves in ascending order.`, `A back-to-back diagram compares two data sets.`), 'S1'],

['S', PC, `Permutations and combinations: what are the formulae?`,
  L(`<sup>n</sup>P<sub>r</sub> = ${fr('n!', '(n − r)!')} (order matters)`, `<sup>n</sup>C<sub>r</sub> = ${fr('n!', 'r!(n − r)!')} (order does not matter)`, `<sup>n</sup>C<sub>r</sub> = <sup>n</sup>C<sub>n−r</sub>`), 'S1'],
['S', PC, `How do you count arrangements with repeats or restrictions?`,
  L(`n different items in a line: n!`, `With repeated items: ${fr('n!', 'p! q! …')}`, `Items that must be together: treat them as one block, then multiply by the arrangements inside the block.`, `Items not together: total − together, or place the others first and slot into gaps.`, `Deal with a restricted position first.`), 'S1'],
['S', PC, `How do you use combinations to find a probability?`,
  L(`P(event) = ${fr('number of favourable selections', 'total number of selections')}`, `Count both using <sup>n</sup>C<sub>r</sub>, for example choosing a committee of r from n.`), 'S1'],

['S', PB, `State the basic probability rules.`,
  L(`P(A′) = 1 − P(A)`, `P(A ∪ B) = P(A) + P(B) − P(A ∩ B)`, `0 ≤ P(A) ≤ 1`), 'S1'],
['S', PB, `Mutually exclusive versus independent events.`,
  L(`Mutually exclusive: P(A ∩ B) = 0, so P(A ∪ B) = P(A) + P(B).`, `Independent: P(A ∩ B) = P(A) × P(B).`, `Two events with non-zero probability cannot be both.`), 'S1'],
['S', PB, `State the conditional probability formula.`,
  L(`P(A | B) = ${fr('P(A ∩ B)', 'P(B)')}`, `P(A ∩ B) = P(A | B) × P(B)`, `If A and B are independent, P(A | B) = P(A).`), 'S1'],
['S', PB, `Rules for tree diagrams.`,
  L(`Multiply along branches (and).`, `Add between branches (or).`, `Branches from one node sum to 1.`, `Second-stage branches are conditional probabilities.`, `P(B) = P(B | A)P(A) + P(B | A′)P(A′)`), 'S1'],
['S', PB, `How do you fill in a Venn diagram?`,
  L(`Start with the intersection and work outwards.`, `Only A = P(A) − P(A ∩ B).`, `The region outside both circles = 1 − P(A ∪ B).`, `Check that all regions sum to 1.`), 'S1'],

['S', DR, `Discrete random variable: key formulae.`,
  L(`ΣP(X = x) = 1`, `E(X) = Σx P(X = x)`, `Var(X) = E(X²) − [E(X)]², where E(X²) = Σx² P(X = x)`, `E(aX + b) = aE(X) + b, Var(aX + b) = a²Var(X)`), 'S1'],

['S', BG, `State the conditions for a binomial model.`,
  L(`A fixed number n of trials.`, `Two outcomes: success or failure.`, `A constant probability p of success.`, `Independent trials.`, `Write X ~ B(n, p).`), 'S1'],
['S', BG, `Binomial probability, mean and variance.`,
  L(`P(X = r) = <sup>n</sup>C<sub>r</sub> p<sup>r</sup>(1 − p)<sup>n−r</sup>`, `E(X) = np`, `Var(X) = np(1 − p)`), 'S1'],
['S', BG, `Convert binomial probabilities into cumulative form.`,
  L(`P(X ≥ r) = 1 − P(X ≤ r − 1)`, `P(X &gt; r) = 1 − P(X ≤ r)`, `P(a ≤ X ≤ b) = P(X ≤ b) − P(X ≤ a − 1)`), 'S1'],
['S', BG, `Geometric distribution: conditions and formulae.`,
  L(`Independent trials, two outcomes, constant p, repeated until the first success.`, `X ~ Geo(p), where X is the trial on which the first success occurs.`, `P(X = r) = (1 − p)<sup>r−1</sup>p`, `P(X &gt; r) = (1 − p)<sup>r</sup>`, `E(X) = ${fr('1', 'p')}`), 'S1'],

['S', NO, `Key properties of the normal distribution X ~ N(μ, σ²).`,
  L(`Bell-shaped and symmetric about μ.`, `σ² is the variance, so σ is the standard deviation.`, `About 68% within 1σ, 95% within 2σ, 99.7% within 3σ.`, `Total area under the curve is 1.`), 'S1'],
['S', NO, `How do you standardise a normal variable?`,
  L(`Z = ${fr('X − μ', 'σ')}, with Z ~ N(0, 1)`, `P(X &lt; a) = P(Z &lt; ${fr('a − μ', 'σ')})`, `Always sketch the curve and shade the region first.`), 'S1'],
['S', NO, `How do you find an unknown μ or σ?`,
  L(`Use the table backwards (inverse normal) to get z from the given probability.`, `Form the equation z = ${fr('x − μ', 'σ')}.`, `With two unknowns, make two equations and solve them simultaneously.`), 'S1'],
['S', NO, `Normal approximation to a binomial, with continuity correction.`,
  L(`If X ~ B(n, p) with np &gt; 5 and nq &gt; 5, then X ≈ Y ~ N(np, npq), where q = 1 − p.`, `P(X ≤ k) → P(Y &lt; k + 0.5)`, `P(X ≥ k) → P(Y &gt; k − 0.5)`, `P(X = k) → P(k − 0.5 &lt; Y &lt; k + 0.5)`), 'S1'],

/* =================== STATISTICS 2 =================== */
['S', PO, `Poisson distribution: conditions and formulae.`,
  L(`Events occur singly, independently and at a constant average rate.`, `X ~ Po(λ)`, `P(X = r) = ${fr('e<sup>−λ</sup>λ<sup>r</sup>', 'r!')}`, `E(X) = Var(X) = λ`), 'S2'],
['S', PO, `Poisson: scaling the rate and adding variables.`,
  L(`If the rate is λ per unit, then over t units use Po(λt).`, `Independent X ~ Po(λ) and Y ~ Po(μ) give X + Y ~ Po(λ + μ).`, `Always match λ to the interval in the question.`), 'S2'],
['S', PO, `When can you approximate with a Poisson or a normal distribution?`,
  L(`B(n, p) ≈ Po(np) when n is large (n &gt; 50) and np &lt; 5.`, `Po(λ) ≈ N(λ, λ) when λ &gt; 15, with continuity correction.`), 'S2'],

['S', LC, `Expectation and variance of a linear combination.`,
  L(`E(aX + bY) = aE(X) + bE(Y)`, `For independent X and Y: Var(aX ± bY) = a²Var(X) + b²Var(Y)`, `Variances always add, even when the variables are subtracted.`, `Var(2X) = 4Var(X), but Var(X<sub>1</sub> + X<sub>2</sub>) = 2Var(X).`), 'S2'],
['S', LC, `What do you know about sums of independent normal variables?`,
  L(`A linear combination of independent normal variables is also normal.`, `Find its mean and variance with the linear combination formulae, then standardise.`, `Define each variable clearly, such as D = X − Y, before calculating.`), 'S2'],

['S', CR, `Probability density function: key properties.`,
  L(`f(x) ≥ 0 for all x.`, `∫ f(x) dx over all x = 1.`, `P(a &lt; X &lt; b) = ∫<sub>a</sub><sup>b</sup> f(x) dx`, `P(X = a) = 0, so &lt; and ≤ give the same probability.`, `Use the piece of f(x) defined on that interval.`), 'S2'],
['S', CR, `Mean, variance, median and mode of a continuous random variable.`,
  L(`E(X) = ∫x f(x) dx`, `Var(X) = ∫x² f(x) dx − [E(X)]²`, `Median m: ∫ f(x) dx from the lower limit to m equals ${fr('1', '2')}.`, `Mode: the value of x where f(x) is greatest.`), 'S2'],

['S', SM, `Unbiased estimates of a population mean and variance.`,
  L(`Mean: ${xb} = ${fr('Σx', 'n')}`, `Variance: s² = ${fr('1', 'n − 1')}(Σx² − n${xb}²) = ${fr('1', 'n − 1')}(Σx² − ${fr('(Σx)²', 'n')})`), 'S2'],
['S', SM, `Central limit theorem and the distribution of the sample mean.`,
  L(`For a large sample (about n ≥ 30), ${xb} ≈ N(μ, ${fr('σ²', 'n')}) whatever the population distribution.`, `If the population is normal, ${xb} ~ N(μ, ${fr('σ²', 'n')}) exactly.`, `Standard error = ${fr('σ', '√n')}`), 'S2'],
['S', SM, `Confidence interval for a population mean.`,
  L(`${xb} ± z × ${fr('σ', '√n')}`, `z = 1.645 (90%), 1.96 (95%), 2.576 (99%).`, `Width = 2z${fr('σ', '√n')}. Halving the width needs 4 times the sample size.`, `If σ is unknown and n is large, use s as the estimate of σ.`), 'S2'],

['S', HT, `Key terms in hypothesis testing.`,
  L(`H<sub>0</sub>: null hypothesis, assumed true.`, `H<sub>1</sub>: alternative hypothesis (one-tailed: &lt; or &gt;, two-tailed: ≠).`, `Significance level: probability of rejecting H<sub>0</sub> when it is true.`, `Test statistic, critical value and critical region: values that lead to rejecting H<sub>0</sub>.`, `For a two-tailed test, use half the significance level in each tail.`), 'S2'],
['S', HT, `Steps for a hypothesis test on a Poisson mean.`,
  L(`1. H<sub>0</sub>: λ = λ<sub>0</sub>, H<sub>1</sub>: λ &lt;, &gt; or ≠ λ<sub>0</sub>.`, `2. Under H<sub>0</sub>, X ~ Po(λ<sub>0</sub>) scaled to the observed interval.`, `3. Find P(X ≥ observed) or P(X ≤ observed).`, `4. Compare with the significance level (halved if two-tailed).`, `5. Conclude in context.`), 'S2'],
['S', HT, `Hypothesis test for a normal mean.`,
  L(`Under H<sub>0</sub>: ${xb} ~ N(μ<sub>0</sub>, ${fr('σ²', 'n')})`, `z = ${fr(xb + ' − μ<sub>0</sub>', 'σ/√n')}`, `Critical z values: 1.645 (5% one-tail), 1.96 (5% two-tail), 2.326 (1% one-tail), 2.576 (1% two-tail).`), 'S2'],
['S', HT, `How should a hypothesis test conclusion be worded?`,
  L(`Reject: "There is sufficient evidence at the 5% level to suggest that …" (in context).`, `Do not reject: "There is insufficient evidence to reject H<sub>0</sub>…" (in context).`, `Never say "accept H<sub>0</sub>" or "proved".`), 'S2'],
['S', HT, `Define Type I and Type II errors.`,
  L(`Type I: rejecting H<sub>0</sub> when it is true.`, `Type II: not rejecting H<sub>0</sub> when it is false.`, `The probability of a Type I error equals the significance level (the actual level for a discrete test).`), 'S2']
];

try { known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}

let subj = 'ALL', topic = 'ALL', status = 'all', deck = [], pos = 0, shuffled = false, flipped = false;

const cardEl = $('card');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const isKnown = i => known.has(cards[i][2]);
const inScope = i => (subj === 'ALL' || cards[i][4] === subj) && (topic === 'ALL' || cards[i][1] === topic);

function topicsFor(s) {
  const out = [];
  cards.forEach(c => { if ((s === 'ALL' || c[4] === s) && !out.includes(c[1])) out.push(c[1]); });
  return out;
}

function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  ['ALL', ...topicsFor(subj)].forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = t === 'ALL' ? 'All topics' : t;
    b.setAttribute('aria-pressed', String(t === topic));
    b.addEventListener('click', () => { topic = t; renderChips(); rebuild(); pos = 0; show(true); });
    box.appendChild(b);
  });
}

function rebuild() {
  deck = order.filter(i => inScope(i) && (status === 'all' || (status === 'known') === isKnown(i)));
}

function fillCard() {
  const idx = deck[pos];
  const front = cardEl.querySelector('.front'), back = cardEl.querySelector('.back');
  if (idx === undefined) {
    cardEl.removeAttribute('data-s');
    $('tagF').textContent = 'No cards';
    $('tagB').textContent = 'No cards';
    $('q').innerHTML = '<span class="empty">No cards match these filters. Change the topic or the Show setting, or reset your progress.</span>';
    $('a').innerHTML = '';
    $('badge').textContent = '';
    return;
  }
  const c = cards[idx];
  cardEl.setAttribute('data-s', c[0]);
  const label = ({P1: 'Pure 1', P3: 'Pure 3', S1: 'Statistics 1', S2: 'Statistics 2'})[c[4]] + ' · ' + c[1];
  $('tagF').textContent = label;
  $('tagB').textContent = label;
  $('q').innerHTML = c[2];
  $('a').innerHTML = c[3];
  $('badge').textContent = isKnown(idx) ? '✓ Got it' : '';
}

function updateMeta() {
  const scope = order.filter(inScope);
  const k = scope.filter(isKnown).length;
  $('pos').textContent = deck.length ? `Card ${pos + 1} of ${deck.length}` : 'Card 0 of 0';
  $('knownCount').textContent = `${k} of ${scope.length} got it`;
  $('fill').style.width = scope.length ? (100 * k / scope.length) + '%' : '0%';
}

function show(instant) {
  if (pos >= deck.length) pos = Math.max(0, deck.length - 1);
  const wasFlipped = flipped;
  flipped = false;
  const update = () => { fillCard(); updateMeta(); };
  if (wasFlipped && !instant && !reduce) {
    cardEl.classList.remove('flipped');
    updateMeta();
    setTimeout(update, 260);
  } else {
    cardEl.classList.remove('flipped');
    update();
  }
}

function flip() {
  if (!deck.length) return;
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function move(step) {
  if (!deck.length) return;
  pos = (pos + step + deck.length) % deck.length;
  show();
}

function mark(value) {
  const idx = deck[pos];
  if (idx === undefined) return;
  if (value) known.add(cards[idx][2]); else known.delete(cards[idx][2]);
  persist();
  const oldPos = pos;
  rebuild();
  const at = deck.indexOf(idx);
  pos = at >= 0 ? (at + 1) % deck.length : Math.min(oldPos, Math.max(0, deck.length - 1));
  show();
}

/* ---------- events ---------- */
cardEl.addEventListener('click', flip);
$('prev').addEventListener('click', () => move(-1));
$('next').addEventListener('click', () => move(1));
$('got').addEventListener('click', () => mark(true));
$('learn').addEventListener('click', () => mark(false));

$('seg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  subj = b.dataset.s; topic = 'ALL';
  $('seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderChips(); rebuild(); pos = 0; show(true);
});

$('status').addEventListener('change', e => { status = e.target.value; rebuild(); pos = 0; show(true); });

$('shuffle').addEventListener('click', e => {
  shuffled = !shuffled;
  if (shuffled) {
    order = cards.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } else {
    order = cards.map((_, i) => i);
  }
  e.currentTarget.setAttribute('aria-pressed', String(shuffled));
  e.currentTarget.textContent = shuffled ? 'Shuffled' : 'Shuffle';
  rebuild(); pos = 0; show(true);
});

let resetTimer = null;
$('reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm');
    b.textContent = 'Tap again to confirm';
    resetTimer = setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'Reset progress'; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  b.classList.remove('confirm');
  b.textContent = 'Reset progress';
  known = new Set(); persist();
  rebuild(); pos = 0; show(true);
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'SELECT' || tag === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  else if (e.key === 'k' || e.key === 'K') mark(true);
  else if (e.key === 'l' || e.key === 'L') mark(false);
  else if ((e.key === ' ' || e.key === 'Enter') && tag !== 'BUTTON') { e.preventDefault(); flip(); }
});

/* ---------- start ---------- */
$('total').textContent = cards.length;
renderChips();
rebuild();
show(true);
</script>
